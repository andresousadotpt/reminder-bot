name: Continuous Integration Pipeline
on:
  push:
    branches:
      - main
      - release-please*
      - feature/*
      - dependabot/*
  pull_request:
    branches:
      - main
      - feature/*
      - dependabot/*
      - release-please*

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 22
        uses: actions/setup-java@v5
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven
      - name: Run the Maven verify phase
        run: mvn verify